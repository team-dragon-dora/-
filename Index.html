<!DOCTYPE html>
<html lang="si" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM DRAGON | Official Portal</title>
  <style>
    :root[data-theme="dark"] {
      --bg: radial-gradient(circle at top, #0f172a, #050811 75%);
      --card: rgba(15, 23, 42, 0.88);
      --input-bg: rgba(2, 6, 23, 0.85);
      --text: #ffffff;
      --muted: #cbd5e1;
      --border: rgba(56, 189, 248, 0.35);
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --badge-bg: rgba(30, 41, 59, 0.92);
      --upload-bg: rgba(14, 165, 233, 0.08);
      --logo-bg: #070c18;
    }

    :root[data-theme="light"] {
      --bg: radial-gradient(circle at top, #e0f2fe, #f8fafc 75%);
      --card: rgba(255, 255, 255, 0.95);
      --input-bg: #f1f5f9;
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(2, 132, 199, 0.3);
      --accent: #0284c7;
      --accent-dark: #0369a1;
      --badge-bg: #e2e8f0;
      --upload-bg: rgba(2, 132, 199, 0.06);
      --logo-bg: #f0f9ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 20px 16px 60px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px 20px;
      margin-bottom: 22px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .dragon-ring {
      width: 126px;
      height: 126px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 26px rgba(56, 189, 248, 0.45);
      background: var(--logo-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .dragon-ring svg {
      width: 92px;
      height: 92px;
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .owner-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 18px 8px 9px;
      text-align: left;
    }

    .dora-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--logo-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .dora-ring svg {
      width: 30px;
      height: 30px;
    }

    .owner-label {
      font-size: 10px;
      letter-spacing: 0.9px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .owner-name {
      font-size: 16px;
      font-weight: 800;
    }

    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .form-card h2 {
      text-align: center;
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .form-desc {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .upload-box {
      display: block;
      border: 2px dashed var(--accent);
      background: var(--upload-bg);
      border-radius: 14px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
    }

    .upload-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .upload-hint {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="file"] {
      display: none;
    }

    .preview-wrap {
      margin-top: 12px;
      display: none;
      text-align: center;
    }

    .preview-wrap img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent));
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .cooldown-banner {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fbbf24;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .footer-socials {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .social-badge:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .social-badge svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button type="button" class="theme-btn" id="themeToggle">
        <span id="themeIcon">☀️</span>
        <span id="themeText">Light Mode</span>
      </button>
    </div>

    <section class="hero">
      <div class="dragon-ring" aria-label="Team Dragon Logo">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="dragonGrad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#7dd3fc" />
              <stop offset="55%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>
          </defs>
          <path d="M44 30 C30 16, 18 18, 15 26 C24 27, 32 32, 38 39 Z" fill="url(#dragonGrad)" />
          <path d="M76 30 C90 16, 102 18, 105 26 C96 27, 88 32, 82 39 Z" fill="url(#dragonGrad)" />
          <path d="M60 20 L67 34 L82 36 L88 52 L78 66 L82 86 L60 102 L38 86 L42 66 L32 52 L38 36 L53 34 Z" fill="url(#dragonGrad)" />
          <path d="M60 32 L72 48 L67 74 L60 88 L53 74 L48 48 Z" fill="#070c18" />
          <polygon points="43,48 54,52 46,56" fill="#fef08a" />
          <polygon points="77,48 66,52 74,56" fill="#fef08a" />
          <path d="M60 44 L65 62 L60 76 L55 62 Z" fill="#38bdf8" />
        </svg>
      </div>

      <h1>TEAM DRAGON</h1>
      <p class="subtitle">TikTok Squad Official Portal &amp; Member Application</p>

      <div class="owner-badge">
        <div class="dora-ring" aria-label="Dora Logo">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="doraGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#bae6fd" />
                <stop offset="100%" stop-color="#0284c7" />
              </linearGradient>
            </defs>
            <path d="M32 7 L51 16 L47 41 L32 57 L17 41 L13 16 Z" fill="url(#doraGrad)" />
            <circle cx="32" cy="31" r="14" fill="#070c18" />
            <text x="32" y="36" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="900" font-family="system-ui, sans-serif">D</text>
          </svg>
        </div>
        <div>
          <div class="owner-label">TEAM OWNER</div>
          <div class="owner-name">DORA</div>
        </div>
      </div>
    </section>

    <section class="form-card">
      <h2>TikTok Squad අයැදුම්පත</h2>
      <p class="form-desc">Team Dragon TikTok squad එකට එක්වීමට විස්තර පුරවා ඔබේ TikTok page screenshot එක upload කරන්න.</p>

      <form id="squadForm">
        <div class="field">
          <label for="ign">නම / In-Game Name *</label>
          <input type="text" id="ign" name="name" placeholder="ඔබේ නම ඇතුළත් කරන්න" required />
        </div>

        <div class="field">
          <label for="tiktokUsername">TikTok Username / Page Link *</label>
          <input type="text" id="tiktokUsername" name="tiktok" placeholder="@your_tiktok_page" required />
        </div>

        <div class="field">
          <label for="mobileNumber">මොබයිල් නම්බරය / Mobile Number *</label>
          <input type="tel" id="mobileNumber" name="mobile" placeholder="07X XXX XXXX" required />
        </div>

        <div class="field">
          <label for="role">භූමිකාව / Role</label>
          <select id="role" name="role">
            <option value="වීඩියෝ එඩිටර්">වීඩියෝ එඩිටර්</option>
            <option value="ක්‍රියට් පේජ්">ක්‍රියට් පේජ්</option>
            <option value="බූට් පේජ්">බූට් පේජ්</option>
          </select>
        </div>

        <div class="field">
          <label>ටික්ටොක් පේජ් එකේ ප්‍රොෆයිල් එක අප්ලෝඩ් කරන්න *</label>
          <label for="tiktokScreenshot" class="upload-box">
            <div class="upload-title">ටික්ටොක් පේජ් එකේ ප්‍රොෆයිල් එක අප්ලෝඩ් කරන්න</div>
            <div class="upload-hint">ඔබේ TikTok profile page එකේ screenshot එක තෝරන්න (JPG / PNG)</div>
          </label>
          <input type="file" id="tiktokScreenshot" name="screenshot" accept="image/*" required />
          <div class="preview-wrap" id="previewWrap">
            <img id="previewImg" alt="TikTok Profile Screenshot Preview" />
          </div>
        </div>

        <div class="field">
          <label for="note">අමතර විස්තර / Note</label>
          <textarea id="note" name="note" rows="3" placeholder="කෙටි විස්තරයක් ලියන්න..."></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit Application</button>
        <div class="cooldown-banner" id="cooldownBanner"></div>
        <div class="status-box" id="statusBox"></div>
      </form>
    </section>

    <footer class="footer-socials" aria-label="Social Pages">
      <a id="tiktokBadgeLink" href="https://www.tiktok.com/@dora_quotes_?_r=1&_t=ZS-9BblzTELckW" target="_blank" rel="noopener noreferrer" class="social-badge">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z" />
        </svg>
        <span>TikTok</span>
      </a>

      <a id="fbBadgeLink" href="https://www.facebook.com/share/1AJwpDYoNS/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="social-badge">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z" />
        </svg>
        <span>FB</span>
      </a>
    </footer>
  </div>

  <script>
    const FORMSPREE_URL = "https://formspree.io/f/mzerjdzy";

    const TIKTOK_PAGE_URL = "https://www.tiktok.com/@dora_quotes_?_r=1&_t=ZS-9BblzTELckW";
    const FB_PAGE_URL = "https://www.facebook.com/share/1AJwpDYoNS/?mibextid=wwXIfr";

    // විනාඩි 5ක cooldown (5 * 60 * 1000 ms)
    const COOLDOWN_MS = 5 * 60 * 1000;
    const COOLDOWN_KEY = "team_dragon_last_submit_at";

    const tiktokBadgeLink = document.getElementById("tiktokBadgeLink");
    const fbBadgeLink = document.getElementById("fbBadgeLink");

    if (TIKTOK_PAGE_URL.trim()) {
      tiktokBadgeLink.href = TIKTOK_PAGE_URL.trim();
    }
    if (FB_PAGE_URL.trim()) {
      fbBadgeLink.href = FB_PAGE_URL.trim();
    }

    const rootEl = document.documentElement;
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    themeToggle.addEventListener("click", () => {
      const isDark = rootEl.getAttribute("data-theme") === "dark";
      if (isDark) {
        rootEl.setAttribute("data-theme", "light");
        themeIcon.textContent = "🌙";
        themeText.textContent = "Dark Mode";
      } else {
        rootEl.setAttribute("data-theme", "dark");
        themeIcon.textContent = "☀️";
        themeText.textContent = "Light Mode";
      }
    });

    const fileInput = document.getElementById("tiktokScreenshot");
    const previewWrap = document.getElementById("previewWrap");
    const previewImg = document.getElementById("previewImg");
    let uploadedDataUrl = "";

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        uploadedDataUrl = "";
        previewWrap.style.display = "none";
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        uploadedDataUrl = ev.target.result || "";
        previewImg.src = uploadedDataUrl;
        previewWrap.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    const form = document.getElementById("squadForm");
    const submitBtn = document.getElementById("submitBtn");
    const cooldownBanner = document.getElementById("cooldownBanner");
    const statusBox = document.getElementById("statusBox");

    function getRemainingCooldownMs() {
      const last = Number(localStorage.getItem(COOLDOWN_KEY) || "0");
      if (!last) return 0;
      const elapsed = Date.now() - last;
      return Math.max(0, COOLDOWN_MS - elapsed);
    }

    function formatTime(ms) {
      const totalSec = Math.ceil(ms / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    }

    function updateCooldownUI() {
      const rem = getRemainingCooldownMs();
      if (rem > 0) {
        submitBtn.disabled = true;
        submitBtn.textContent = "රැඳී සිටින්න (" + formatTime(rem) + ")";
        cooldownBanner.style.display = "block";
        cooldownBanner.textContent =
          "ඔබ දැනටමත් අයැදුම්පතක් යවා ඇත. නැවත යැවීමට තව " +
          formatTime(rem) +
          " ලෝඩ් වීමට ඉතිරිව ඇත.";
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Application";
        cooldownBanner.style.display = "none";
      }
    }

    setInterval(updateCooldownUI, 1000);
    updateCooldownUI();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (getRemainingCooldownMs() > 0) {
        updateCooldownUI();
        return;
      }

      const nameVal = document.getElementById("ign").value.trim();
      const tiktokVal = document.getElementById("tiktokUsername").value.trim();
      const mobileVal = document.getElementById("mobileNumber").value.trim();
      const roleVal = document.getElementById("role").value;
      const noteVal = document.getElementById("note").value.trim();
      const file = fileInput.files && fileInput.files[0];

      if (!nameVal || !tiktokVal || !mobileVal || !file) {
        statusBox.style.display = "block";
        statusBox.style.background = "rgba(248, 113, 113, 0.15)";
        statusBox.style.color = "#f87171";
        statusBox.textContent = "කරුණාකර නම, TikTok page එක, Mobile number එක, සහ profile screenshot එක ඇතුළත් කරන්න.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "යවමින් පවතී...";

      const payload = {
        notification: "TEAM DRAGON Squad එකට අලුත් අයැදුම්පතක් (Application) ලැබුණා!",
        name: nameVal,
        tiktok: tiktokVal,
        mobile: mobileVal,
        role: roleVal,
        note: noteVal,
        screenshot_file: file.name,
        screenshot_preview: uploadedDataUrl ? uploadedDataUrl.slice(0, 120000) : ""
      };

      try {
        const res = await fetch(FORMSPREE_URL, {
          method: "POST",
          body: JSON.stringify(payload),
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          }
        });

        const resData = await res.json().catch(() => ({}));

        if (res.ok) {
          localStorage.setItem(COOLDOWN_KEY, String(Date.now()));
          updateCooldownUI();

          statusBox.style.display = "block";
          statusBox.style.background = "rgba(74, 222, 128, 0.15)";
          statusBox.style.color = "#4ade80";
          statusBox.innerHTML =
            "<strong>සාර්ථකව යවන ලදී!</strong><br>" +
            "ඔබේ අයැදුම්පත සාර්ථකව යවා ඇත. නැවත යැවීමට විනාඩි 5ක් රැඳී සිටින්න.";
          form.reset();
          uploadedDataUrl = "";
          previewWrap.style.display = "none";
        } else {
          updateCooldownUI();
          statusBox.style.display = "block";
          statusBox.style.background = "rgba(248, 113, 113, 0.15)";
          statusBox.style.color = "#f87171";
          statusBox.textContent =
            resData.error || "යැවීමේදී දෝෂයක් සිදු විය. කරුණාකර මද වේලාවකින් නැවත උත්සාහ කරන්න.";
        }
      } catch (err) {
        updateCooldownUI();
        statusBox.style.display = "block";
        statusBox.style.background = "rgba(248, 113, 113, 0.15)";
        statusBox.style.color = "#f87171";
        statusBox.textContent =
          "අන්තර්ජාල සම්බන්ධතාව හෝ preview environment එක පරීක්ෂා කර GitHub Pages / live browser එකෙන් උත්සාහ කරන්න.";
      }
    });
  </script>
